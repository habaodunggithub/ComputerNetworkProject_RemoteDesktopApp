<!DOCTYPE html>
<html lang="vi" class="h-full bg-gray-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển Server C++</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full text-gray-200 p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-white mb-6">Bảng điều khiển Server C++</h1>

        <!-- TRẠNG THÁI KẾT NỐI -->
        <div class="mb-6 bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-2 text-white">Trạng thái kết nối</h2>

            <div class="flex items-center space-x-2">
                <div id="status-indicator" class="w-4 h-4 rounded-full bg-red-500 animate-pulse"></div>
                <span id="status-text" class="text-gray-400">Chưa kết nối</span>
            </div>

            <input type="text" id="ws-url"
                   class="w-full p-2 mt-3 bg-gray-700 border border-gray-600 rounded-md text-white"
                   value="ws://127.0.0.1:9002">
            <button id="connect-btn"
                    class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
                Kết nối
            </button>
        </div>

        <!-- LOG -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3 text-white">Log (Nhật ký)</h2>
            <div id="log-output"
                 class="h-32 overflow-y-auto bg-gray-900 p-3 rounded-md border border-gray-700 text-sm font-mono">
                <p class="text-gray-500">Chưa có hoạt động nào...</p>
            </div>
        </div>

        <!-- KHỞI ĐỘNG ỨNG DỤNG -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3 text-white">Khởi động Ứng dụng</h2>
            <div class="flex flex-col sm:flex-row sm:space-x-2">
                <input type="text" id="app-name"
                       class="flex-grow p-2 bg-gray-700 border border-gray-600 rounded-md text-white"
                       placeholder="notepad.exe">
                <button id="start-app-btn"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">
                    Bắt đầu Ứng dụng
                </button>
            </div>
        </div>

        <!-- DANH SÁCH ỨNG DỤNG -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold text-white">Danh sách Ứng dụng đang chạy</h2>

                <button id="list-apps-btn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md">
                    Làm mới
                </button>
            </div>

            <div id="app-list"
                 class="h-96 overflow-y-auto bg-gray-900 p-3 rounded-md border border-gray-700">
                <p class="text-gray-500 text-center">Nhấn "Làm mới" để xem danh sách.</p>
            </div>
        </div>

        <!-- KHỞI ĐỘNG TIẾN TRÌNH -->
        <div class="mt-6 bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3 text-white">Khởi động Tiến trình</h2>
            <div class="flex flex-col sm:flex-row sm:space-x-2">
                <input type="text" id="proc-path"
                       class="flex-grow p-2 bg-gray-700 border border-gray-600 rounded-md text-white"
                       placeholder="C:\\Windows\\System32\\notepad.exe">
                <input type="text" id="proc-args"
                       class="flex-grow p-2 bg-gray-700 border border-gray-600 rounded-md text-white"
                       placeholder="args (optional)">
                <button id="proc-start-btn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md">
                    Bắt đầu Tiến trình
                </button>
            </div>
        </div>

        <!-- DANH SÁCH TIẾN TRÌNH -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold text-white">Danh sách Tiến trình</h2>

                <button id="pm-refresh"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md">
                    Làm mới
                </button>
            </div>

            <div id="pm-list"
                 class="h-96 overflow-y-auto bg-gray-900 p-3 rounded-md border border-gray-700">
                <table class="w-full text-left table-auto" id="pm-table">
                    <thead></thead>
                    <tbody>
                        <tr><td class="text-gray-500 text-center p-4">Nhấn "Làm mới".</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SCREENSHOT -->
        <div class="mt-6 bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold text-white mb-3">Chụp màn hình Server</h2>
            <button id="btn-capture"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">
                Chụp màn hình
            </button>
            <div id="screenshot-result" class="mt-4"></div>
        </div>
    </div>

    <!-- ========================== JAVASCRIPT =========================== -->
    <script>
        let ws = null;
        let processes = [];

        const ui = {
            url: document.getElementById("ws-url"),
            connect: document.getElementById("connect-btn"),
            status: document.getElementById("status-text"),
            indicator: document.getElementById("status-indicator"),
            log: document.getElementById("log-output"),

            appName: document.getElementById("app-name"),
            startApp: document.getElementById("start-app-btn"),
            listApps: document.getElementById("list-apps-btn"),
            appList: document.getElementById("app-list"),

            procPath: document.getElementById("proc-path"),
            procArgs: document.getElementById("proc-args"),
            startProc: document.getElementById("proc-start-btn"),

            pmRefresh: document.getElementById("pm-refresh"),
            pmTable: document.getElementById("pm-table"),

            capture: document.getElementById("btn-capture"),
            screenshot: document.getElementById("screenshot-result")
        };

        function log(msg, type = "info") {
            const p = document.createElement("p");
            const t = new Date().toLocaleTimeString();

            p.className =
                type === "error" ? "text-red-400" :
                type === "success" ? "text-green-400" :
                "text-blue-400";

            p.textContent = `[${t}] ${msg}`;
            ui.log.appendChild(p);
            ui.log.scrollTop = ui.log.scrollHeight;
        }

        function connectWS() {
            const url = ui.url.value.trim();
            if (!url) return;

            log(`Đang kết nối đến ${url}...`);
            ui.status.textContent = "Đang kết nối...";
            ui.indicator.className = "w-4 h-4 rounded-full bg-yellow-500 animate-pulse";

            ws = new WebSocket(url);

            ws.onopen = () => {
                ui.indicator.className = "w-4 h-4 rounded-full bg-green-500";
                ui.status.textContent = "Đã kết nối";
                log("Kết nối WebSocket thành công!", "success");
            };

            ws.onclose = () => {
                ui.indicator.className = "w-4 h-4 rounded-full bg-red-500";
                ui.status.textContent = "Đã ngắt kết nối";
                log("Kết nối WebSocket đã bị đóng.", "error");
            };

            ws.onerror = () => {
                ui.indicator.className = "w-4 h-4 rounded-full bg-red-500";
                ui.status.textContent = "Lỗi kết nối";
                log("Lỗi WebSocket.", "error");
            };

            ws.onmessage = handleMessage;
        }

        function send(cmd) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log("Không thể gửi: Chưa kết nối WebSocket.", "error");
                return;
            }
            ws.send(JSON.stringify(cmd));
            log("Đã gửi: " + JSON.stringify(cmd), "info");
        }

        function handleMessage(event) {
            let msg;
            try { msg = JSON.parse(event.data); }
            catch { return log("Dữ liệu không phải JSON", "error"); }

            switch (msg.type) {
                case "application_list":
                    renderAppList(msg.data);
                    break;

                case "process_list":
                    processes = msg.data;
                    renderProcessTable();
                    break;

                case "screenshot":
                    ui.screenshot.innerHTML =
                        `<img src="data:image/png;base64,${msg.data}" class="max-w-full rounded border border-gray-700">`;
                    break;

                case "status":
                    log(msg.message || (msg.success ?
                        "Thành công" : "Thất bại"), msg.success ? "success" : "error");
                    break;

                case "error":
                    log("Server lỗi: " + msg.message, "error");
                    break;
            }
        }

        function renderAppList(data) {
            if (!data || data.length === 0) {
                ui.appList.innerHTML = `<p class="text-gray-500 text-center">Không có ứng dụng nào.</p>`;
                return;
            }

            let html = `<table class="w-full text-left">
                <thead>
                    <tr class="border-b border-gray-600">
                        <th class="p-2">Tên</th>
                        <th class="p-2">Số tiến trình</th>
                        <th class="p-2">Hành động</th>
                    </tr>
                </thead><tbody>`;

            for (const app of data) {
                html += `
                    <tr class="border-b border-gray-800">
                        <td class="p-2">${app.name}</td>
                        <td class="p-2">${app.process_count}</td>
                        <td class="p-2">
                            <button class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded"
                                    onclick='send({command:"stop_application",app_name:"${app.name}"})'>
                                Dừng
                            </button>
                        </td>
                    </tr>`;
            }

            html += "</tbody></table>";
            ui.appList.innerHTML = html;
        }

        function renderProcessTable() {
            if (!processes || processes.length === 0) {
                ui.pmTable.innerHTML = `<tbody><tr><td class="text-gray-500 p-4 text-center">Không có tiến trình nào.</td></tr></tbody>`;
                return;
            }

            let html = `
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>Tên</th>
                        <th>RAM</th>
                        <th>Action</th>
                    </tr>
                </thead><tbody>`;

            for (const p of processes) {
                html += `
                    <tr class="border-b border-gray-800">
                        <td class="p-2">${p.pid}</td>
                        <td class="p-2">${p.name}</td>
                        <td class="p-2">${Math.round(p.workingSet / 1024 / 1024)} MB</td>
                        <td class="p-2">
                            <button class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded"
                                    onclick='send({command:"stop_process_pid",pid:${p.pid}})'>
                                Dừng
                            </button>
                        </td>
                    </tr>`;
            }

            html += "</tbody>";
            ui.pmTable.innerHTML = html;
        }

        // Gán sự kiện
        ui.connect.onclick = connectWS;
        ui.startApp.onclick = () => send({ command: "start_application", app_name: ui.appName.value.trim() });
        ui.listApps.onclick = () => send({ command: "list_applications" });
        ui.startProc.onclick = () => send({ command: "start_process", path: ui.procPath.value.trim(), args: ui.procArgs.value });
        ui.pmRefresh.onclick = () => send({ command: "list_processes" });
        ui.capture.onclick = () => send({ command: "capture_screen" });
    </script>

</body>
</html>
